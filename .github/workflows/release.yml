name: Release

# Publishes a GitHub release with Chimedes.exe for the version in CMakeLists.txt.
#
# - On every push to main, if there is no release for that version yet, it builds
#   it, creates the tag vX.Y.Z on that commit and publishes the release. Bumping
#   the version (and adding its section to CHANGELOG.md) is all a release needs.
# - Pushing a tag vX.Y.Z builds and publishes that tag.
# - Run it by hand from the Actions tab to rebuild the current version.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^project\(Chimedes VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match project version $version in CMakeLists.txt"
              exit 1
            fi
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            publish=true
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            publish=false
          else
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version, publish: $publish"

  build-windows:
    name: Build Windows x64
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/Chimedes
          cp build/Chimedes_artefacts/Release/Chimedes.exe dist/Chimedes/
          cp LICENSE dist/Chimedes/LICENSE.txt
          cp Resources/Fonts/OFL-*.txt dist/Chimedes/
          cp dist/Chimedes/Chimedes.exe "dist/Chimedes-$VERSION-windows-x64.exe"
          cd dist
          7z a -tzip "Chimedes-$VERSION-windows-x64.zip" Chimedes > /dev/null
          sha256sum Chimedes-*.exe Chimedes-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/Chimedes-*.exe
            dist/Chimedes-*.zip
            dist/SHA256SUMS.txt

  publish:
    name: Publish release
    needs: [check, build-windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Chimedes $TAG" > notes.md; fi
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Chimedes $TAG" --notes-file notes.md --latest
          fi
