name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the demo project
        2. Switch the track to algorithm mode
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chimedes version
      placeholder: v0.1.0, or a commit hash if you built it yourself
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, audio, or the `.chimedes` project that shows the problem (you can drag files here).
